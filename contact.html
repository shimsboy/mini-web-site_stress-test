<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="스트레스 진단소 문의 및 의견 보내기">
  <meta name="theme-color" content="#6c5ce7">
  <title>문의하기 | 스트레스 진단소</title>
  <style>
    :root {
      --bg-start:#6c5ce7;
      --bg-end:#00cec9;
      --surface:#ffffff;
      --text:#161616;
      --muted:#595959;
      --primary:#5b62e8;
      --primary-dark:#4148c9;
      --border:#e7e7ef;
      --focus:#111827;
      --shadow:0 18px 48px rgba(24, 24, 50, .20);
    }
    *,*::before,*::after{box-sizing:border-box}
    html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
    body{
      margin:0;
      min-height:100vh;
      min-height:100dvh;
      display:grid;
      place-items:center;
      padding:24px 16px;
      color:var(--text);
      background:linear-gradient(135deg,var(--bg-start),var(--bg-end));
      font-family:"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
      line-height:1.65;
    }
    main{width:min(100%,520px)}
    .brand{
      margin:0 0 14px;
      text-align:center;
      color:#fff;
      font-size:26px;
      font-weight:850;
      letter-spacing:-.04em;
    }
    .card{
      padding:32px 24px;
      border:1px solid rgba(255,255,255,.55);
      border-radius:24px;
      background:var(--surface);
      box-shadow:var(--shadow);
    }
    h1{
      margin:0 0 10px;
      text-align:center;
      font-size:26px;
      line-height:1.25;
      letter-spacing:-.04em;
    }
    .intro{
      max-width:40ch;
      margin:0 auto 24px;
      text-align:center;
      color:var(--muted);
      font-size:15px;
    }
    .contact-box{
      padding:18px;
      border:1px solid var(--border);
      border-radius:16px;
      background:#f8f8ff;
      text-align:center;
    }
    .label{
      margin:0 0 6px;
      color:var(--muted);
      font-size:13px;
      font-weight:700;
    }
    .email{
      display:inline-block;
      color:var(--text);
      font-size:16px;
      font-weight:800;
      overflow-wrap:anywhere;
      text-decoration:none;
    }
    .email:hover{text-decoration:underline}
    .actions{display:grid;gap:10px;margin-top:18px}
    .button{
      min-height:48px;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:12px 18px;
      border:0;
      border-radius:14px;
      background:var(--primary);
      color:#fff;
      font-size:15px;
      font-weight:800;
      text-decoration:none;
      transition:background-color .18s ease,transform .18s ease;
    }
    .button:hover{background:var(--primary-dark)}
    .button:active{transform:scale(.98)}
    .button.secondary{background:#ededf5;color:#222}
    .button.secondary:hover{background:#dfdfea}
    a:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
    .guide{
      margin:22px 0 0;
      padding-top:18px;
      border-top:1px solid var(--border);
      color:var(--muted);
      font-size:13px;
    }
    .guide strong{color:var(--text)}
    .privacy{
      margin:12px 0 0;
      color:#727272;
      font-size:12px;
    }
    @media (max-width:420px){
      body{padding:18px 12px}
      .card{padding:26px 18px;border-radius:20px}
      h1{font-size:23px}
      .email{font-size:15px}
    }
    @media (prefers-reduced-motion:reduce){
      *,*::before,*::after{transition:none!important}
    }
  </style>
</head>
<body>
  <main>
    <p class="brand">🧪 스트레스 진단소</p>
    <section class="card" aria-labelledby="contact-title">
      <h1 id="contact-title">문의하기</h1>
      <p class="intro">오류 제보, 개선 아이디어, 콘텐츠 및 광고 관련 문의를 보내주세요. 확인 후 가능한 범위에서 답변드리겠습니다.</p>

      <div class="contact-box">
        <p class="label">연락용 이메일</p>
        <a class="email" href="mailto:stresstest.contact@gmail.com">stresstest.contact@gmail.com</a>
      </div>

      <div class="actions">
        <a class="button" href="mailto:stresstest.contact@gmail.com?subject=%5B%EC%8A%A4%ED%8A%B8%EB%A0%88%EC%8A%A4%20%EC%A7%84%EB%8B%A8%EC%86%8C%5D%20%EB%AC%B8%EC%9D%98">이메일 보내기</a>
        <a class="button secondary" href="./index.html">← 테스트 홈으로 돌아가기</a>
      </div>

      <div class="guide">
        <strong>빠른 확인을 위한 안내</strong><br>
        오류 문의 시 사용한 기기, 브라우저, 문제가 발생한 화면을 함께 적어주시면 확인에 도움이 됩니다.
      </div>
      <p class="privacy">이메일로 보내주신 정보는 문의 확인과 답변 목적으로만 사용합니다. 민감한 개인정보는 보내지 마세요.</p>
    </section>
  </main>
</body>
</html>
