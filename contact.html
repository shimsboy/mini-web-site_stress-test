<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="스트레스 진단소 문의 및 의견 보내기">
  <title>문의하기 | 스트레스 진단소</title>
  <style>
    :root{--primary:#5879f2;--primary-dark:#4263db;--text:#20202a;--muted:#666672;--border:#e5e5ea;--surface:#fff;--soft:#f6f5ff;--success:#16794a;--error:#b42318;--focus:#335cff}
    *{box-sizing:border-box}
    body{min-height:100vh;margin:0;padding:24px 14px;background:linear-gradient(135deg,#5e7bf4,#19b9cb);color:var(--text);font-family:Pretendard,"Noto Sans KR",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;line-height:1.6}
    main{width:min(100%,600px);margin:0 auto;padding:30px 32px;background:var(--surface);box-shadow:0 18px 50px rgba(23,31,67,.16)}
    h1{margin:0 0 4px;text-align:center;font-size:28px;line-height:1.3;letter-spacing:-.04em}
    .intro{margin:0 auto 28px;text-align:center;color:var(--muted);font-size:17px;line-height:1.55}
    form{display:grid;gap:16px}
    label{display:grid;gap:7px;font-size:16px;font-weight:750}
    input,textarea{width:100%;border:1px solid var(--border);border-radius:15px;background:#fff;color:var(--text);font:inherit;font-size:16px;outline:none;box-shadow:0 0 0 1px rgba(0,0,0,.02);transition:border-color .18s,box-shadow .18s}
    input{height:56px;padding:0 18px}
    textarea{min-height:150px;padding:15px 18px;resize:vertical}
    input:focus,textarea:focus{border-color:var(--focus);box-shadow:0 0 0 3px rgba(51,92,255,.12)}
    .button{min-height:68px;margin-top:6px;border:0;border-radius:16px;background:var(--primary);color:#fff;font:inherit;font-size:18px;font-weight:850;cursor:pointer;transition:background-color .18s,transform .18s,opacity .18s}
    .button:hover{background:var(--primary-dark)}
    .button:active{transform:scale(.99)}
    .button:disabled{cursor:wait;opacity:.68}
    .status{display:none;margin:2px 0 0;padding:12px 14px;border-radius:12px;text-align:center;font-size:14px;font-weight:700}
    .status.show{display:block}
    .status.success{background:#eaf8f0;color:var(--success)}
    .status.error{background:#fff0ee;color:var(--error)}
    .direct{margin:26px 0 0;padding:18px;border-radius:15px;background:var(--soft);text-align:center;color:var(--muted);font-size:14px}
    .direct a{display:block;margin-top:4px;color:#202038;font-size:16px;font-weight:850;overflow-wrap:anywhere;text-decoration:none}
    .direct a:hover{text-decoration:underline}
    .back{display:block;margin:20px auto 0;color:#4b4b57;text-align:center;font-size:14px;font-weight:700}
    .privacy{margin:14px 0 0;color:#777782;text-align:center;font-size:12px}
    .hp{position:absolute!important;left:-10000px!important;width:1px!important;height:1px!important;overflow:hidden!important}
    :focus-visible{outline:3px solid var(--focus);outline-offset:3px}
    @media(max-width:620px){body{padding:0}main{min-height:100vh;padding:22px 20px 30px}h1{font-size:25px}.intro{font-size:16px}.button{min-height:62px}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important}}
  </style>
</head>
<body>
  <main>
    <h1>📫 문의하기</h1>
    <p class="intro">테스트 오류 제보, 새 테스트 제안, 광고·제휴 문의 등<br>무엇이든 편하게 남겨주세요.</p>

    <form id="contactForm" novalidate>
      <label>이름 / 닉네임
        <input id="contactName" name="name" type="text" autocomplete="name" maxlength="60" required>
      </label>
      <label>답장 받을 이메일
        <input id="contactEmail" name="email" type="email" inputmode="email" autocomplete="email" maxlength="120" required>
      </label>
      <label>문의 내용
        <textarea id="contactMessage" name="message" maxlength="3000" required></textarea>
      </label>

      <input type="hidden" name="_subject" value="[스트레스 진단소] 새 문의가 도착했습니다">
      <input type="hidden" name="_template" value="table">
      <input type="text" name="_honey" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true">

      <button id="sendButton" class="button" type="submit">이메일로 문의 보내기 →</button>
      <p id="formStatus" class="status" role="status" aria-live="polite"></p>
    </form>

    <div class="direct">
      또는 아래 주소로 바로 메일을 보내셔도 됩니다
      <a href="mailto:stresstest.contact@gmail.com">stresstest.contact@gmail.com</a>
    </div>
    <a class="back" href="./index.html">← 테스트 홈으로 돌아가기</a>
    <p class="privacy">입력하신 정보는 문의 확인과 답변 목적으로만 사용됩니다.</p>
  </main>

  <script>
    (function(){
      var form = document.getElementById('contactForm');
      var button = document.getElementById('sendButton');
      var status = document.getElementById('formStatus');
      var endpoint = 'https://formsubmit.co/ajax/stresstest.contact@gmail.com';

      function showStatus(message, type){
        status.textContent = message;
        status.className = 'status show ' + type;
      }

      form.addEventListener('submit', async function(event){
        event.preventDefault();
        if(!form.checkValidity()){
          form.reportValidity();
          return;
        }

        button.disabled = true;
        button.textContent = '전송 중...';
        status.className = 'status';

        try{
          var response = await fetch(endpoint, {
            method: 'POST',
            headers: {'Accept':'application/json'},
            body: new FormData(form)
          });
          var result = await response.json().catch(function(){ return {}; });
          if(!response.ok || result.success === 'false' || result.success === false){
            throw new Error(result.message || '전송 실패');
          }
          showStatus('문의가 전송되었습니다. 확인 후 입력하신 이메일로 답변드리겠습니다.', 'success');
          form.reset();
        }catch(error){
          showStatus('전송하지 못했습니다. 잠시 후 다시 시도하거나 아래 이메일 주소로 보내주세요.', 'error');
        }finally{
          button.disabled = false;
          button.textContent = '이메일로 문의 보내기 →';
        }
      });
    })();
  </script>
</body>
</html>
