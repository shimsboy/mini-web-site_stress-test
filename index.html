<!--
  ======================================================
  [중요] 모바일에서 이 파일이 "안 열리는" 이유
  1) 로컬 다운로드한 .html 파일은 폰 기본 파일앱에서 브라우저로 자동 연결되지 않는 경우가 많습니다.
  2) file:// 프로토콜에서는 공유(navigator.share), 클립보드 복사 API가 보안상 차단되어
     에러가 나면서 스크립트가 멈출 수 있습니다. (이 버전은 모두 try/catch로 안전 처리했습니다)

  => 가장 확실한 해결책: Netlify Drop(https://app.netlify.com/drop)에 이 파일을 드래그&드롭하면
     별도 가입 없이 즉시 공개 URL이 생성되고, 그 링크는 모든 폰/PC 브라우저에서 정상 작동합니다.

  [애드센스 연동 안내]
  1) <head>에 발급받은 애드센스 자동광고 스크립트를 붙여넣으세요.
  2) <div class="ad-slot"> 안에 <ins class="adsbygoogle"> 코드를 넣고
     (adsbygoogle = window.adsbygoogle || []).push({}); 를 실행하세요.
  ======================================================
-->

<style>
  :root{
    --bg1:#6C5CE7; --bg2:#00CEC9; --card:#ffffff; --text:#111111; --sub:#4a4a4a;
    --accent:#FF6B6B; --accent2:#5B7FFF;
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
  html, body{ touch-action:manipulation; }
  body{
    font-family:'Apple SD Gothic Neo','Malgun Gothic',-apple-system,sans-serif;
    background:linear-gradient(135deg,var(--bg1),var(--bg2));
    min-height:100vh; display:flex; justify-content:center; padding:20px;
    color:var(--text); font-size:16px;
  }
  .wrap{ width:100%; max-width:480px; }
  .site-header{ text-align:center; color:#fff; margin-bottom:14px; }
  .site-header .logo{ font-size:26px; font-weight:800; }
  .site-header .tagline{ font-size:13px; opacity:.9; margin-top:4px; }
  .ad-slot{
    background:rgba(255,255,255,0.92); border:1px dashed #999;
    color:#333 !important; text-align:center; font-size:12px; padding:14px; margin:14px 0;
    border-radius:12px; font-weight:600;
  }
  .card{
    background:var(--card); border-radius:24px; padding:26px 22px;
    box-shadow:0 20px 40px rgba(0,0,0,0.18); min-height:400px;
    display:flex; flex-direction:column; justify-content:space-between;
    color:var(--text);
  }
  h1{ font-size:21px; line-height:1.4; text-align:center; margin-bottom:8px; color:#111;}
  .sub{ text-align:center; color:var(--sub); font-size:14px; margin-bottom:18px;}
  .section-label{ font-size:12.5px; font-weight:700; color:#888; margin:16px 0 8px 2px; }
  .test-list{ display:flex; flex-direction:column; gap:12px; }
  .test-card{
    display:flex; align-items:center; gap:14px; padding:16px; border-radius:16px;
    border:2px solid #eee; cursor:pointer; transition:.15s; text-align:left; background:#fff;
  }
  .test-card:active{ border-color:var(--accent2); background:#f7f8ff; }
  .test-card .icon{ font-size:34px; flex-shrink:0; }
  .test-card .info .t-title{ font-size:16px; font-weight:800; color:#111; }
  .test-card .info .t-desc{ font-size:12.5px; color:#666; margin-top:2px; }
  .badge{
    display:inline-block; font-size:10px; background:var(--accent); color:#fff;
    padding:2px 8px; border-radius:10px; margin-left:6px; vertical-align:middle;
  }
  .badge.game{ background:#00b894; }
  .btn{
    display:block; width:100%; padding:16px; border:none; border-radius:14px;
    background:var(--accent2); color:#ffffff; font-size:16px; font-weight:700;
    cursor:pointer; margin-top:14px; -webkit-appearance:none; appearance:none;
  }
  .btn.red{ background:var(--accent); }
  .btn.green{ background:#00b894; }
  .btn:active{ opacity:.85; }
  .btn.secondary{ background:#eee; color:#222; }
  .progress{ width:100%; height:8px; background:#eee; border-radius:6px; overflow:hidden; margin-bottom:22px; }
  .progress-bar{ height:100%; background:var(--accent2); width:0%; transition:width .3s; }
  .q-text{ font-size:18px; font-weight:700; margin-bottom:20px; line-height:1.5; text-align:center; color:#111;}
  .option{
    display:block; width:100%; text-align:left; padding:14px 16px; margin-bottom:9px;
    border:2px solid #ddd; border-radius:14px; background:#fafafa; cursor:pointer;
    font-size:15px; color:#222;
  }
  .option:active{ border-color:var(--accent2); background:#f0f4ff; }
  .center{ text-align:center; }
  .emoji-big{ font-size:56px; margin:8px 0; }
  .result-title{ font-size:22px; font-weight:800; margin-bottom:6px; }
  .result-desc{ font-size:14.5px; color:#333; line-height:1.7; margin-bottom:16px; }
  .score-box{ display:flex; justify-content:space-between; gap:10px; margin:14px 0; }
  .score-item{ flex:1; background:#f5f5ff; border-radius:12px; padding:12px; text-align:center; }
  .score-item .label{ font-size:11.5px; color:#555; }
  .score-item .val{ font-size:19px; font-weight:800; color:var(--bg1); }
  .meter{ width:100%; height:12px; background:#eee; border-radius:8px; overflow:hidden; margin-top:8px; }
  .meter-bar{ height:100%; background:linear-gradient(90deg,#5B7FFF,#FF6B6B); }
  .back-link{ text-align:center; font-size:13px; color:#888; margin-top:14px; cursor:pointer; text-decoration:underline; padding:6px; }
  .solution-box{
    background:#eef7f0; border:1px solid #c9ecd4; border-radius:14px; padding:14px 16px;
    text-align:left; margin-top:4px; margin-bottom:6px;
  }
  .solution-label{ font-size:13px; font-weight:800; color:#00915a; margin-bottom:6px; }
  .solution-text{ font-size:13.5px; color:#2a2a2a; line-height:1.6; }
  .footer-note{
    font-size:11px; color:#222; text-align:center; margin-top:14px;
    background:rgba(255,255,255,0.85); padding:8px; border-radius:8px;
  }
  .share-row{ display:flex; gap:10px; margin-top:12px; }
  .share-row .btn{ margin-top:0; flex:1; font-size:14px; padding:13px; }
  .toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
    background:#222; color:#fff; padding:10px 18px; border-radius:20px; font-size:13px;
    opacity:0; transition:opacity .3s; pointer-events:none; z-index:999; max-width:90%; text-align:center;
  }
  .toast.show{ opacity:1; }

  /* ===== 게임 스타일 (구형 브라우저 호환: aspect-ratio 대신 padding-top 사용) ===== */
  .game-stats{ display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; }
  .game-stats .stat{ font-size:14px; font-weight:700; color:#333; }
  .game-stats .stat span{ color:var(--accent); font-size:18px; }
  .bubble-grid{
    display:grid; grid-template-columns:repeat(6, 1fr); gap:8px;
    background:#eef1ff; border-radius:16px; padding:14px; margin-bottom:14px;
  }
  .bubble-cell{ position:relative; width:100%; padding-top:100%; }
  .bubble{
    position:absolute; top:0; left:0; width:100%; height:100%; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #ffffff, #cfd8ff 60%, #a9b8ff 100%);
    box-shadow:inset -2px -2px 4px rgba(0,0,0,0.15), 0 2px 3px rgba(0,0,0,0.1);
    transition:transform .05s ease-out;
  }
  .bubble.popping{
    animation:bubblePop .28s ease-out forwards;
  }
  @keyframes bubblePop{
    0%{ transform:scale(1); }
    30%{ transform:scale(1.35); filter:brightness(1.3); }
    60%{ transform:scale(0.55) rotate(8deg); }
    100%{ transform:scale(0.72) rotate(0deg); }
  }
  .bubble.popped{
    background:#e2e2e2; box-shadow:inset 1px 1px 3px rgba(0,0,0,0.2);
    transform:scale(0.72);
  }
  .bubble-cell{ position:relative; width:100%; padding-top:100%; overflow:visible; }
  .burst-ring{
    position:absolute; top:50%; left:50%; width:10px; height:10px; border-radius:50%;
    border:3px solid #7c8cff; transform:translate(-50%,-50%) scale(1);
    opacity:.9; pointer-events:none; animation:burstRing .35s ease-out forwards; z-index:5;
  }
  @keyframes burstRing{
    0%{ width:10px; height:10px; opacity:.9; border-width:4px; }
    100%{ width:120%; height:120%; opacity:0; border-width:1px; }
  }
  .burst-particle{
    position:absolute; top:50%; left:50%; width:6px; height:6px; border-radius:50%;
    background:#a9b8ff; pointer-events:none; z-index:5;
    animation:burstFly .45s ease-out forwards;
  }
  @keyframes burstFly{
    0%{ transform:translate(-50%,-50%) translate(0,0) scale(1); opacity:1; }
    100%{ transform:translate(-50%,-50%) translate(var(--fx), var(--fy)) scale(0.2); opacity:0; }
  }
  .pop-word{
    position:absolute; top:20%; left:50%; transform:translate(-50%,-50%);
    font-size:13px; font-weight:900; color:#5B7FFF; pointer-events:none; z-index:6;
    animation:popWordUp .55s ease-out forwards; white-space:nowrap;
  }
  @keyframes popWordUp{
    0%{ opacity:1; transform:translate(-50%,-50%) scale(0.8); }
    30%{ opacity:1; transform:translate(-50%,-140%) scale(1.15); }
    100%{ opacity:0; transform:translate(-50%,-220%) scale(1); }
  }
  .bubble-grid.arena-shake{ animation:arenaShake .18s linear; }
  @keyframes arenaShake{
    0%{ transform:translate(0,0); } 30%{ transform:translate(-3px,2px); }
    60%{ transform:translate(3px,-2px); } 100%{ transform:translate(0,0); }
  }
  .combo-msg{
    text-align:center; font-size:13px; font-weight:700; color:var(--accent);
    height:18px; margin-bottom:6px;
  }

  /* ===== 스트레스 브레이커(스매시) 게임 스타일 ===== */
  .smash-timerbar{ width:100%; height:10px; background:#eee; border-radius:6px; overflow:hidden; margin-bottom:14px; }
  .smash-timerbar-inner{ height:100%; background:linear-gradient(90deg,#FF6B6B,#ff3b3b); width:100%; transition:width .1s linear; }
  .smash-stats{ display:flex; justify-content:space-between; margin-bottom:10px; }
  .smash-stats .stat{ font-size:14px; font-weight:700; color:#333; }
  .smash-stats .stat span{ color:var(--accent); font-size:20px; }
  .smash-arena{
    position:relative; width:100%; height:280px; background:radial-gradient(circle,#2b2b40,#151522);
    border-radius:20px; display:flex; align-items:center; justify-content:center;
    overflow:hidden; margin-bottom:14px; touch-action:manipulation; -webkit-tap-highlight-color:transparent;
    user-select:none; -webkit-user-select:none;
  }
  .smash-target{
    font-size:96px; cursor:pointer; user-select:none; -webkit-user-select:none;
    filter:drop-shadow(0 6px 10px rgba(0,0,0,0.4));
    transition:transform .06s ease-out;
  }
  .smash-arena.hit .smash-target{ transform:scale(0.78) rotate(-6deg); }
  .smash-arena.shake{ animation:smashShake .12s linear; }
  @keyframes smashShake{
    0%{ transform:translate(0,0); } 25%{ transform:translate(-6px,3px); }
    50%{ transform:translate(6px,-3px); } 75%{ transform:translate(-4px,2px); } 100%{ transform:translate(0,0); }
  }
  .smash-flash{
    position:absolute; top:0; left:0; width:100%; height:100%; background:#fff;
    opacity:0; pointer-events:none; border-radius:20px;
  }
  .smash-flash.on{ opacity:.35; transition:opacity .15s ease-out; }
  .smash-pop{
    position:absolute; font-size:22px; font-weight:800; color:#fff; pointer-events:none;
    animation:smashPopUp .6s ease-out forwards;
  }
  @keyframes smashPopUp{
    0%{ opacity:1; transform:translateY(0) scale(1); }
    100%{ opacity:0; transform:translateY(-60px) scale(1.4); }
  }
  .smash-rank{ font-size:42px; font-weight:900; margin:10px 0; }
</style>
</head>

<div class="wrap">

  <div class="card" id="app"></div>

<script>
/* ===================== 테스트 데이터 ===================== */
const TESTS = {
  burnout: {

      { text:"최근 한 달, 작은 실수에도 스스로를 심하게 자책했나요?", axis:"b", opts:[
        {t:"아니요", s:0},{t:"한두 번", s:1},{t:"자주", s:2},{t:"매일 그렇다", s:3}] },
      { text:"동료·상사와의 관계가 버겁게 느껴지는 정도는?", axis:"b", opts:[
        {t:"전혀 아님", s:0},{t:"약간", s:1},{t:"많이", s:2},{t:"숨쉬기도 힘듦", s:3}] },
      { text:"주말이 끝나가는 일요일 저녁, 기분은?", axis:"b", opts:[
        {t:"평온함", s:0},{t:"살짝 아쉬움", s:1},{t:"막연한 불안", s:2},{t:"극심한 불안·우울", s:3}] },
      { text:"휴가를 다녀와도 에너지가 회복되는 느낌이 드나요?", axis:"b", opts:[

      { text:"최근 6개월간 새로운 걸 배우거나 성장했다고 느끼나요?", axis:"j", opts:[
        {t:"많이 성장했다", s:0},{t:"조금은 있다", s:1},{t:"거의 없다", s:2},{t:"전혀 없다, 정체됐다", s:3}] },
      { text:"채용 공고나 이직 관련 검색을 얼마나 자주 하나요?", axis:"j", opts:[

      { text:"현재 연봉·보상이 시장 대비 어떻다고 느끼나요?", axis:"j", opts:[
        {t:"충분히 만족", s:0},{t:"약간 아쉬움", s:1},{t:"낮은 편", s:2},{t:"명백히 낮음, 동결 지속", s:3}] },
      { text:"지금 회사에서 내 커리어 방향성이 명확한가요?", axis:"j", opts:[
        {t:"매우 명확함", s:0},{t:"어느 정도", s:1},{t:"불분명함", s:2},{t:"전혀 안 보임", s:3}] },

    resultFn:(bScore,jScore)=>{
      const bLevel = bScore >= 14 ? 'extreme' : bScore >= 9 ? 'high' : bScore >= 5 ? 'moderate' : 'low';
      const jHigh = jScore >= 9;
      const key = bLevel + '_' + (jHigh ? 'j1' : 'j0');
      const map = {
        extreme_j1:{ emoji:"🚨", title:"완전 소진 + 즉시 탈출형",

        extreme_j0:{ emoji:"🆘", title:"위험 신호 소진형",

          solution:"① 이번 달 안에 연차 최소 3일 연속 사용 신청 ② 상사에게 업무량 조정 요청(구체적 숫자로 말하기) ③ 수면 시간 7시간 확보를 1순위로 두기. 이직보다 몸을 먼저 회복시키는 게 더 급합니다." },

/* ===================== 테스트 흐름 ===================== */
function openIntro(key){
  currentTestKey = key;
  const t = TESTS[key];
  document.getElementById('app').innerHTML = `
    <div class="center">
      <div class="emoji-big">${t.introEmoji}</div>
      <h1>${t.introTitle}</h1>
      <div class="sub">${t.introSub}</div>
      <button class="btn" onclick="startTest()">테스트 시작하기 →</button>
      <div class="back-link" onclick="renderHome()">← 홈으로</div>
    </div>`;
}

function startTest(){
  currentIdx = 0; scoreA = 0; scoreB = 0;
  renderQuestion();
}

function renderQuestion(){
  const t = TESTS[currentTestKey];
  const q = t.questions[currentIdx];
  const pct = Math.round((currentIdx / t.questions.length) * 100);
  let optsHtml = q.opts.map((o,i)=>`<div class="option" onclick="answer(${i})">${o.t}</div>`).join('');
  document.getElementById('app').innerHTML = `
    <div>
      <div class="progress"><div class="progress-bar" style="width:${pct}%"></div></div>
      <div class="q-text">Q${currentIdx+1}. ${q.text}</div>
      ${optsHtml}
    </div>`;
}

function answer(i){
  const t = TESTS[currentTestKey];
  const q = t.questions[currentIdx];
  const s = q.opts[i].s;
  if(t.type === 'matrix'){
    if(q.axis === 'b') scoreA += s; else scoreB += s;
  } else {
    scoreA += s;
  }
  currentIdx++;
  if(currentIdx < t.questions.length){
    renderQuestion();
  } else {
    renderResult();
  }
}

function renderResult(){
  const t = TESTS[currentTestKey];
  let r, extraHtml = '';
  if(t.type === 'matrix'){
    r = t.resultFn(scoreA, scoreB);
    extraHtml = `
      <div class="score-box">
        <div class="score-item"><div class="label">번아웃 지수</div><div class="val">${scoreA}/18</div></div>
        <div class="score-item"><div class="label">이직 갈증 지수</div><div class="val">${scoreB}/18</div></div>
      </div>`;
  } else {
    r = t.resultFn(scoreA);
    extraHtml = `
      <div class="score-box" style="text-align:center;">
        <div class="label">육아 방전 지수</div>
        <div class="val">${r.pct}%</div>
        <div class="meter"><div class="meter-bar" style="width:${r.pct}%"></div></div>
      </div>`;
  }
  const otherKey = Object.keys(TESTS).find(k => k !== currentTestKey);
  const otherTest = TESTS[otherKey];

  const solutionHtml = r.solution ? `
      <div class="solution-box">
        <div class="solution-label">💡 이렇게 해보세요</div>
        <div class="solution-text">${r.solution}</div>
      </div>` : '';

  document.getElementById('app').innerHTML = `
    <div class="center">
      <div class="emoji-big">${r.emoji}</div>
      <div class="result-title" style="color:var(--accent2)">${r.title}</div>
      ${extraHtml}
      <div class="result-desc">${r.desc}</div>
      ${solutionHtml}
      <div class="ad-slot">광고 영역 (결과 하단 인라인) — 애드센스 코드 삽입 위치</div>
      <div class="share-row">
        <button class="btn" onclick="shareResult()">결과 공유하기</button>
        <button class="btn secondary" onclick="startTest()">다시 하기</button>
      </div>
      <button class="btn" style="background:#ff3b3b;" onclick="openGame2()">🥊 스트레스 브레이커로 강하게 풀기</button>
      <button class="btn green" onclick="openGame()">🫧 뽁뽁이로 살짝 풀기</button>
      <button class="btn red" onclick="openIntro('${otherKey}')">${otherTest.icon} ${otherTest.title}도 해보기</button>
      <div class="back-link" onclick="renderHome()">← 홈으로</div>
    </div>`;
}

function shareResult(){
  try{
    const t = TESTS[currentTestKey];
    let r = t.type === 'matrix' ? t.resultFn(scoreA, scoreB) : t.resultFn(scoreA);
    const text = `[${t.title}] 결과: ${r.title} ${r.emoji}\n너도 확인해봐 👉 스트레스 진단소 (사이트 링크)`;
    if(navigator.share){
      navigator.share({ title:'스트레스 진단소', text }).catch(()=>{});
    } else if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(()=>{
        showToast('결과가 복사됐어요! 카톡/SNS에 붙여넣어 공유해보세요 📋');
      }).catch(()=>{
        showToast('공유 기능은 실제 웹사이트 주소(URL)에서만 작동해요. 온라인에 배포한 뒤 다시 시도해주세요.');
      });
    } else {
      showToast('공유 기능은 실제 웹사이트 주소(URL)에서만 작동해요. 온라인에 배포한 뒤 다시 시도해주세요.');
    }
  } catch(e){
    showToast('공유 기능은 실제 웹사이트 주소(URL)에서만 작동해요.');
  }
}

/* ===================== 게임: 뽁뽁이 팡팡 ===================== */
const COMBO_MESSAGES = [
  "시원하다! 🎉","좋아요, 계속!","스트레스 뻥!","점점 개운해져요","거의 다 왔어요!"
];

function openGame(){
  poppedCount = 0;
  document.getElementById('app').innerHTML = `
    <div>
      <h1>🫧 뽁뽁이 팡팡</h1>
      <div class="sub">${TOTAL_BUBBLES}개를 다 터뜨리면 스트레스도 끝!</div>
      <div class="game-stats">
        <div class="stat">터뜨린 개수: <span id="pop-count">0</span> / ${TOTAL_BUBBLES}</div>
      </div>
      <div class="combo-msg" id="combo-msg"></div>
      <div class="bubble-grid" id="bubble-grid"></div>
      <button class="btn secondary" onclick="resetGame()">뽁뽁이 새로 채우기</button>
      <div class="back-link" onclick="renderHome()">← 홈으로</div>
    </div>`;
  buildBubbles();
}

const POP_WORDS = ["뻥!","펑!","팡!","시원해!","뽁!","캬!"];

function buildBubbles(){
  const grid = document.getElementById('bubble-grid');
  grid.innerHTML = '';
  for(let i=0;i<TOTAL_BUBBLES;i++){
    const cell = document.createElement('div');
    cell.className = 'bubble-cell';
    const b = document.createElement('div');
    b.className = 'bubble';
    b.addEventListener('click', ()=>popBubble(b, cell));
    b.addEventListener('touchstart', function(e){ e.preventDefault(); popBubble(b, cell); }, {passive:false});
    cell.appendChild(b);
    grid.appendChild(cell);
  }
}

function popBubble(el, cell){
  if(el.classList.contains('popped') || el.classList.contains('popping')) return;
  el.classList.add('popping');
  poppedCount++;
  const counter = document.getElementById('pop-count');
  if(counter) counter.textContent = poppedCount;

  try{ if(navigator.vibrate) navigator.vibrate(15); }catch(e){}

  const ring = document.createElement('div');
  ring.className = 'burst-ring';
  cell.appendChild(ring);
  setTimeout(()=>ring.remove(), 400);

  for(let i=0;i<6;i++){
    const p = document.createElement('div');
    p.className = 'burst-particle';
    const angle = (Math.PI*2/6)*i + Math.random()*0.5;
    const dist = 26 + Math.random()*14;
    p.style.setProperty('--fx', Math.cos(angle)*dist + 'px');
    p.style.setProperty('--fy', Math.sin(angle)*dist + 'px');
    cell.appendChild(p);
    setTimeout(()=>p.remove(), 500);
  }

  if(Math.random() < 0.35){
    const word = document.createElement('div');
    word.className = 'pop-word';
    word.textContent = POP_WORDS[Math.floor(Math.random()*POP_WORDS.length)];
    cell.appendChild(word);
    setTimeout(()=>word.remove(), 600);
  }

  const grid = document.getElementById('bubble-grid');
  if(grid){
    grid.classList.remove('arena-shake');
    void grid.offsetWidth;
    grid.classList.add('arena-shake');
  }

  setTimeout(()=>{
    el.classList.remove('popping');
    el.classList.add('popped');
  }, 280);

  const msgBox = document.getElementById('combo-msg');
  if(poppedCount % 10 === 0 && msgBox){
    msgBox.textContent = COMBO_MESSAGES[Math.min(Math.floor(poppedCount/10)-1, COMBO_MESSAGES.length-1)];
    setTimeout(()=>{ if(msgBox) msgBox.textContent=''; }, 1200);
  }

  if(poppedCount === TOTAL_BUBBLES){
    setTimeout(()=>{
      document.getElementById('app').innerHTML += `
        <div class="ad-slot">광고 영역 (게임 완료 후) — 애드센스 코드 삽입 위치</div>
        <div class="center">
          <div class="emoji-big">🎊</div>
          <div class="result-title" style="color:var(--accent)">완료! 스트레스 방출 성공</div>
          <div class="result-desc">${TOTAL_BUBBLES}개를 다 터뜨렸어요. 기분이 조금 나아졌길 바라요!</div>
          <button class="btn green" onclick="resetGame()">한 번 더 하기</button>
          <div class="back-link" onclick="renderHome()">← 홈으로</div>
        </div>`;
    }, 300);
  }
}

function resetGame(){
  openGame();
}

/* ===================== 게임2: 스트레스 브레이커 (30초 스매시) ===================== */
const SMASH_DURATION = 30;
const SMASH_TARGETS = ["😤","😡","🤬"];
let smashScore = 0;
let smashTimeLeft = SMASH_DURATION;
let smashTimerId = null;
let smashActive = false;
let smashCombo = 0;
let smashBest = 0;

function openGame2(){
  smashScore = 0;
  smashTimeLeft = SMASH_DURATION;
  smashActive = false;
  smashCombo = 0;
  try{ smashBest = Number(localStorage.getItem('smashBest') || 0); }catch(e){ smashBest = 0; }

  document.getElementById('app').innerHTML = `
    <div>
      <h1>🥊 스트레스 브레이커</h1>
      <div class="sub">30초 동안 화면을 마구 눌러서 스트레스를 날려버리세요!</div>
      <div class="smash-timerbar"><div class="smash-timerbar-inner" id="smash-timerbar-inner" style="width:100%"></div></div>
      <div class="smash-stats">
        <div class="stat">점수: <span id="smash-score">0</span></div>
        <div class="stat">남은 시간: <span id="smash-time">${SMASH_DURATION}</span>초</div>
      </div>
      <div class="combo-msg" id="smash-combo-msg"></div>
      <div class="smash-arena" id="smash-arena">
        <div class="smash-flash" id="smash-flash"></div>
        <div class="smash-target" id="smash-target">😤</div>
      </div>
      <div class="sub" id="smash-hint" style="margin-bottom:6px;">타겟을 눌러서 시작하세요!</div>
      <button class="btn secondary" onclick="renderHome()">← 홈으로</button>
    </div>`;

  const target = document.getElementById('smash-target');
  target.addEventListener('click', smashHit);
  target.addEventListener('touchstart', function(e){ e.preventDefault(); smashHit(); }, {passive:false});
}

function smashHit(){
  if(smashTimeLeft <= 0) return;
  if(!smashActive){
    smashActive = true;
    startSmashTimer();
    const hint = document.getElementById('smash-hint');
    if(hint) hint.textContent = '계속 두드리세요! 💥';
  }
  smashScore++;
  smashCombo++;
  const scoreEl = document.getElementById('smash-score');
  if(scoreEl) scoreEl.textContent = smashScore;

  const arena = document.getElementById('smash-arena');
  const flash = document.getElementById('smash-flash');
  const targetEl = document.getElementById('smash-target');
  if(arena){
    arena.classList.add('hit','shake');
    setTimeout(()=>{ arena.classList.remove('hit','shake'); }, 130);
  }
  if(flash){
    flash.classList.add('on');
    setTimeout(()=>flash.classList.remove('on'), 150);
  }
  if(targetEl){
    targetEl.textContent = SMASH_TARGETS[Math.floor(Math.random()*SMASH_TARGETS.length)];
    const arenaRect = arena.getBoundingClientRect();
    const maxX = Math.max(arenaRect.width - 96, 0);
    const maxY = Math.max(arenaRect.height - 96, 0);
    targetEl.style.position = 'absolute';
    targetEl.style.left = Math.floor(Math.random()*maxX) + 'px';
    targetEl.style.top = Math.floor(Math.random()*maxY) + 'px';
  }
  const popMsg = document.createElement('div');
  popMsg.className = 'smash-pop';
  popMsg.textContent = '+1';
  popMsg.style.left = (40 + Math.random()*40) + '%';
  popMsg.style.top = '50%';
  if(arena){
    arena.appendChild(popMsg);
    setTimeout(()=>popMsg.remove(), 650);
  }

  const comboBox = document.getElementById('smash-combo-msg');
  if(comboBox && smashCombo % 10 === 0){
    comboBox.textContent = ["파워풀해요! 💪","더 세게!! 🔥","스트레스가 날아간다!","멈추지 마세요! ⚡"][Math.floor(Math.random()*4)];
    setTimeout(()=>{ if(comboBox) comboBox.textContent=''; }, 900);
  }
}

function startSmashTimer(){
  smashTimerId = setInterval(()=>{
    smashTimeLeft--;
    const timeEl = document.getElementById('smash-time');
    const barEl = document.getElementById('smash-timerbar-inner');
    if(timeEl) timeEl.textContent = smashTimeLeft;
    if(barEl) barEl.style.width = Math.max(0, (smashTimeLeft/SMASH_DURATION)*100) + '%';
    if(smashTimeLeft <= 0){
      clearInterval(smashTimerId);
      endSmashGame();
    }
  }, 1000);
}

function endSmashGame(){
  smashActive = false;
  let isNewBest = false;
  if(smashScore > smashBest){
    smashBest = smashScore;
    isNewBest = true;
    try{ localStorage.setItem('smashBest', String(smashBest)); }catch(e){}
  }
  let rank, rankEmoji;
  if(smashScore >= 90){ rank = "분노 조절 마스터 🏆"; rankEmoji = "🔥"; }
  else if(smashScore >= 60){ rank = "스트레스 브레이커 💪"; rankEmoji = "🥊"; }
  else if(smashScore >= 30){ rank = "적당히 화난 사람 😅"; rankEmoji = "😤"; }
  else { rank = "아직 여유로운 편 🌿"; rankEmoji = "🌿"; }

  document.getElementById('app').innerHTML = `
    <div class="ad-slot">광고 영역 (게임 완료 후) — 애드센스 코드 삽입 위치</div>
    <div class="center">
      <div class="emoji-big">${rankEmoji}</div>
      <div class="smash-rank">${smashScore}점</div>
      <div class="result-title" style="color:var(--accent)">${rank}</div>
      ${isNewBest ? '<div class="result-desc" style="color:#00b894; font-weight:800;">🎉 신기록 달성!</div>' : ''}
      <div class="result-desc">최고 기록: ${smashBest}점<br>30초 동안 시원하게 스트레스를 날려버렸어요!</div>
      <div class="share-row">
        <button class="btn" onclick="shareSmashResult(${smashScore})">결과 공유하기</button>
        <button class="btn secondary" onclick="openGame2()">다시 하기</button>
      </div>
      <button class="btn green" onclick="openGame()">🫧 뽁뽁이도 터뜨려보기</button>
      <div class="back-link" onclick="renderHome()">← 홈으로</div>
    </div>`;
}

function shareSmashResult(score){
  try{
    const text = `[스트레스 브레이커] 30초 동안 ${score}점 획득! 🥊\n너도 스트레스 날려보러 와봐 👉 스트레스 진단소 (사이트 링크)`;
    if(navigator.share){
      navigator.share({ title:'스트레스 진단소', text }).catch(()=>{});
    } else if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(()=>{
        showToast('결과가 복사됐어요! 카톡/SNS에 붙여넣어 공유해보세요 📋');
      }).catch(()=>{
        showToast('공유 기능은 실제 웹사이트 주소(URL)에서만 작동해요.');
      });
    } else {
      showToast('공유 기능은 실제 웹사이트 주소(URL)에서만 작동해요.');
    }
  } catch(e){
    showToast('공유 기능은 실제 웹사이트 주소(URL)에서만 작동해요.');
  }
}

renderHome();
</script>
