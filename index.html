        {t:"전혀 없음", s:0},{t:"가끔", s:1},{t:"자주", s:2},{t:"매일 검색만 함", s:3}] },
      { text:"요즘 '이 정도면 나 잘하고 있나?' 하는 생각이 드는 빈도는?", opts:[
        {t:"확신 있음", s:0},{t:"가끔 흔들림", s:1},{t:"자주 불안", s:2},{t:"매일 자기 의심", s:3}] }
    ],
    resultFn:(score)=>{
      const pct = Math.round((score/36)*100);
      if(pct < 25) return { emoji:"😌", title:"츄르 육아 고수형", pct,
        desc:"체력도 멘탈도 안정적으로 육아를 즐기고 있어요! 나만의 페이스를 잘 지키면서 육아 동지들에게 노하우도 나눠주세요." };
      if(pct < 50) return { emoji:"😅", title:"고군분투 밸런스형", pct,
        desc:"체력과 멘탈 사이에서 아슬아슬한 줄타기 중이에요. 하루 30분이라도 '내 시간'을 사수해보세요." };
      if(pct < 75) return { emoji:"😩", title:"육퇴 카운트다운형", pct,
        desc:"이미 방전 경고등이 들어온 상태예요. 완벽한 부모가 되려는 부담을 잠시 내려놓아보세요." };
      return { emoji:"🆘", title:"긴급 SOS 방전형", pct,
        desc:"지금은 '더 잘하기'보다 '나를 회복하기'가 먼저예요. 주변에 꼭 도움을 요청하세요." };
    }
  }
};

const GAME = {
  icon:"🫧", title:"뽁뽁이 팡팡 스트레스 해소", badge:"게임",
  listDesc:"터뜨릴 때마다 스트레스가 뻥! 뽁뽁이 60개 도전"
};

/* ===================== 상태 ===================== */
let currentTestKey = null;
let currentIdx = 0;
let scoreA = 0, scoreB = 0;
let poppedCount = 0;
const TOTAL_BUBBLES = 60;

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2200);
}

/* ===================== 홈 ===================== */
function renderHome(){
  const testCards = Object.entries(TESTS).map(([key,t])=>`
    <div class="test-card" onclick="openIntro('${key}')">
      <div class="icon">${t.icon}</div>
      <div class="info">
        <div class="t-title">${t.title}<span class="badge">${t.badge}</span></div>
        <div class="t-desc">${t.listDesc}</div>
      </div>
    </div>`).join('');

  document.getElementById('app').innerHTML = `
    <h1>어떤 걸 해볼까요?</h1>
    <div class="sub">진단도 하고, 스트레스도 뻥 날려버리세요</div>
    <div class="section-label">📋 진단 테스트</div>
    <div class="test-list">${testCards}</div>
    <div class="section-label">🎮 스트레스 해소 게임</div>
    <div class="test-list">
      <div class="test-card" onclick="openGame()">
        <div class="icon">${GAME.icon}</div>
        <div class="info">
          <div class="t-title">${GAME.title}<span class="badge game">${GAME.badge}</span></div>
          <div class="t-desc">${GAME.listDesc}</div>
        </div>
      </div>
    </div>
  `;
}

/* ===================== 테스트 흐름 ===================== */
function openIntro(key){
  currentTestKey = key;
  const t = TESTS[key];
  document.getElementById('app').innerHTML = `
    <div class="center">
      <div class="emoji-big">${t.introEmoji}</div>
      <h1>${t.introTitle}</h1>
      <div class="sub">${t.introSub}</div>
      <button class="btn" onclick="startTest()">테스트 시작하기 →</button>
      <div class="back-link" onclick="renderHome()">← 홈으로</div>
    </div>`;
}

function startTest(){
  currentIdx = 0; scoreA = 0; scoreB = 0;
  renderQuestion();
}

function renderQuestion(){
  const t = TESTS[currentTestKey];
  const q = t.questions[currentIdx];
  const pct = Math.round((currentIdx / t.questions.length) * 100);
  let optsHtml = q.opts.map((o,i)=>`<div class="option" onclick="answer(${i})">${o.t}</div>`).join('');
  document.getElementById('app').innerHTML = `
    <div>
      <div class="progress"><div class="progress-bar" style="width:${pct}%"></div></div>
      <div class="q-text">Q${currentIdx+1}. ${q.text}</div>
      ${optsHtml}
    </div>`;
}

function answer(i){
  const t = TESTS[currentTestKey];
  const q = t.questions[currentIdx];
  const s = q.opts[i].s;
  if(t.type === 'matrix'){
    if(q.axis === 'b') scoreA += s; else scoreB += s;
  } else {
    scoreA += s;
  }
  currentIdx++;
  if(currentIdx < t.questions.length){
    renderQuestion();
  } else {
    renderResult();
  }
}

function renderResult(){
  const t = TESTS[currentTestKey];
  let r, extraHtml = '';
  if(t.type === 'matrix'){
    r = t.resultFn(scoreA, scoreB);
    extraHtml = `
      <div class="score-box">
        <div class="score-item"><div class="label">번아웃 지수</div><div class="val">${scoreA}/18</div></div>
        <div class="score-item"><div class="label">이직 갈증 지수</div><div class="val">${scoreB}/18</div></div>
      </div>`;
  } else {
    r = t.resultFn(scoreA);
    extraHtml = `
      <div class="score-box" style="text-align:center;">
        <div class="label">육아 방전 지수</div>
        <div class="val">${r.pct}%</div>
        <div class="meter"><div class="meter-bar" style="width:${r.pct}%"></div></div>
      </div>`;
  }
  const otherKey = Object.keys(TESTS).find(k => k !== currentTestKey);
  const otherTest = TESTS[otherKey];

  document.getElementById('app').innerHTML = `
    <div class="center">
      <div class="emoji-big">${r.emoji}</div>
      <div class="result-title" style="color:var(--accent2)">${r.title}</div>
      ${extraHtml}
      <div class="result-desc">${r.desc}</div>
      <div class="ad-slot">광고 영역 (결과 하단 인라인) — 애드센스 코드 삽입 위치</div>
      <div class="share-row">
        <button class="btn" onclick="shareResult()">결과 공유하기</button>
        <button class="btn secondary" onclick="startTest()">다시 하기</button>
      </div>
      <button class="btn green" onclick="openGame()">🫧 스트레스 뽁뽁이로 풀러 가기</button>
      <button class="btn red" onclick="openIntro('${otherKey}')">${otherTest.icon} ${otherTest.title}도 해보기</button>
      <div class="back-link" onclick="renderHome()">← 홈으로</div>
    </div>`;
}

function shareResult(){
  try{
    const t = TESTS[currentTestKey];
    let r = t.type === 'matrix' ? t.resultFn(scoreA, scoreB) : t.resultFn(scoreA);
    const text = `[${t.title}] 결과: ${r.title} ${r.emoji}\n너도 확인해봐 👉 ${SITE_URL}`;
    if(navigator.share){
      navigator.share({ title:'스트레스 진단소', text, url:SITE_URL }).catch(()=>{});
    } else if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(()=>{
        showToast('결과가 복사됐어요! 카톡/SNS에 붙여넣어 공유해보세요 📋');
      }).catch(()=>{
        showToast('공유 기능은 실제 웹사이트 주소(URL)에서만 작동해요.');
      });
    } else {
      showToast('공유 기능은 실제 웹사이트 주소(URL)에서만 작동해요.');
    }
  } catch(e){
    showToast('공유 기능은 실제 웹사이트 주소(URL)에서만 작동해요.');
  }
}

/* ===================== 게임: 뽁뽁이 팡팡 ===================== */
const COMBO_MESSAGES = [
  "시원하다! 🎉","좋아요, 계속!","스트레스 뻥!","점점 개운해져요","거의 다 왔어요!"
];

function openGame(){
  poppedCount = 0;
  document.getElementById('app').innerHTML = `
    <div>
      <h1>🫧 뽁뽁이 팡팡</h1>
      <div class="sub">${TOTAL_BUBBLES}개를 다 터뜨리면 스트레스도 끝!</div>
      <div class="game-stats">
        <div class="stat">터뜨린 개수: <span id="pop-count">0</span> / ${TOTAL_BUBBLES}</div>
      </div>
      <div class="combo-msg" id="combo-msg"></div>
      <div class="bubble-grid" id="bubble-grid"></div>
      <button class="btn secondary" onclick="resetGame()">뽁뽁이 새로 채우기</button>
      <div class="back-link" onclick="renderHome()">← 홈으로</div>
    </div>`;
  buildBubbles();
}

function buildBubbles(){
  const grid = document.getElementById('bubble-grid');
  grid.innerHTML = '';
  for(let i=0;i<TOTAL_BUBBLES;i++){
    const cell = document.createElement('div');
    cell.className = 'bubble-cell';
    const b = document.createElement('div');
    b.className = 'bubble';
    b.addEventListener('click', ()=>popBubble(b));
    b.addEventListener('touchstart', function(e){ e.preventDefault(); popBubble(b); }, {passive:false});
    cell.appendChild(b);
    grid.appendChild(cell);
  }
}

function popBubble(el){
  if(el.classList.contains('popped')) return;
  el.classList.add('popped');
  poppedCount++;
  const counter = document.getElementById('pop-count');
  if(counter) counter.textContent = poppedCount;

  const msgBox = document.getElementById('combo-msg');
  if(poppedCount % 10 === 0 && msgBox){
    msgBox.textContent = COMBO_MESSAGES[Math.min(Math.floor(poppedCount/10)-1, COMBO_MESSAGES.length-1)];
    setTimeout(()=>{ if(msgBox) msgBox.textContent=''; }, 1200);
  }

  if(poppedCount === TOTAL_BUBBLES){
    setTimeout(()=>{
      document.getElementById('app').innerHTML += `
        <div class="ad-slot">광고 영역 (게임 완료 후) — 애드센스 코드 삽입 위치</div>
        <div class="center">
          <div class="emoji-big">🎊</div>
          <div class="result-title" style="color:var(--accent)">완료! 스트레스 방출 성공</div>
          <div class="result-desc">${TOTAL_BUBBLES}개를 다 터뜨렸어요. 기분이 조금 나아졌길 바라요!</div>
          <button class="btn green" onclick="resetGame()">한 번 더 하기</button>
          <div class="back-link" onclick="renderHome()">← 홈으로</div>
        </div>`;
    }, 300);
  }
}

function resetGame(){
  openGame();
}

renderHome();
</script>
</body>
</html>
